<h2>Exercício 9 - Classificação dos produtos</h2>

<ul>
  <li
    *ngFor="let produto of produtos"
    [ngClass]="{
      'vermelho': produto.quantidade === 0,
      'amarelo': produto.quantidade > 0 && produto.quantidade <= 5,
      'verde': produto.quantidade > 5
    }">

    <strong>{{ produto.nome }}</strong>

    - Quantidade: {{ produto.quantidade }}

    - {{ obterSituacao(produto.quantidade) }}

  </li>
</ul>
