<h2>Exercício 11 - Exibir somente produtos disponíveis</h2>

<button (click)="somenteDisponiveis = false">
  Mostrar todos
</button>

<button (click)="somenteDisponiveis = true">
  Somente disponíveis
</button>

<ul>

  <ng-container *ngFor="let produto of produtos">

    <li *ngIf="!somenteDisponiveis || produto.quantidade > 0">

      {{ produto.nome }} -
      Quantidade: {{ produto.quantidade }}

    </li>

  </ng-container>

</ul>
