<h2>Exercício 7 - Cores alternadas</h2>

<ul>
  <li
    *ngFor="let disciplina of disciplinas; let primeiro = first; let ultimo = last; let par = even; let impar = odd"
    [ngClass]="{
      'par': par,
      'impar': impar,
      'primeiro': primeiro,
      'ultimo': ultimo
    }">

    {{ disciplina }}

  </li>
</ul>
