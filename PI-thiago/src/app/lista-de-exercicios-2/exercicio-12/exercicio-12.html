<h2>Exercício 12 - Cadastro simplificado</h2>

<div>

  <label>Nome:</label>

  <input
    type="text"
    [(ngModel)]="nome">

  <br><br>

  <label>Quantidade:</label>

  <input
    type="number"
    [(ngModel)]="quantidade">

  <br><br>

  <button (click)="cadastrar()">
    Cadastrar
  </button>

</div>

<p *ngIf="mensagem">
  {{ mensagem }}
</p>

<h3>Produtos cadastrados</h3>

<p *ngIf="produtos.length === 0">
  Nenhum produto cadastrado.
</p>

<ul>

  <li *ngFor="let produto of produtos">

    {{ produto.nome }} -
    Quantidade: {{ produto.quantidade }}

    <button (click)="excluir(produto.id)">
      Excluir
    </button>

  </li>

</ul>
