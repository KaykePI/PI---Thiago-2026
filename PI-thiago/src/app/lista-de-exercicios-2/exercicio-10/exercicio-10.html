<h2>Exercício 10 - Promoção e estilo dinâmico</h2>

<ul>

  <li *ngFor="let produto of produtos">

    <strong>{{ produto.nome }}</strong>

    <p
      [ngStyle]="{
        'font-weight': produto.promocao ? 'bold' : 'normal',
        'color': produto.promocao ? 'red' : 'black'
      }">

      Preço: {{ produto.preco | currency:'BRL' }}

    </p>

    <p *ngIf="produto.promocao">
      Produto em promoção
    </p>

    <button (click)="alternarPromocao(produto)">
      {{ produto.promocao ? 'Remover promoção' : 'Colocar em promoção' }}
    </button>

  </li>

</ul>
