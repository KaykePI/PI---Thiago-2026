<h2>Desafio Final - Matrícula em Curso</h2>

<label>
  Nome do aluno:

  <input
    type="text"
    [(ngModel)]="nomeAluno"
    placeholder="Digite seu nome">
</label>

<p>
  Aluno: {{ nomeAluno }}
</p>

<p>
  Quantidade de disciplinas:
  {{ quantidadeDisciplinas }}
</p>

<button
  (click)="diminuir()"
  [disabled]="quantidadeDisciplinas === 1">
  -
</button>

<button (click)="aumentar()">
  +
</button>

<br><br>

<button
  (click)="realizarMatricula()"
  [disabled]="nomeAluno.trim() === ''">
  Realizar Matrícula
</button>

<p>
  {{ mensagem }}
</p>
